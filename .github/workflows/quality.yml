name: Quality

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - master
  push:
    branches:
      - portfolio/revamp-2026

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Lint, typecheck, unit, security, Prisma validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/lmere_ci?sslmode=disable
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          npx eslint . --format json --output-file eslint-report.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Audit production dependencies
        id: dependency_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: npm run test:unit

      - name: Validate Prisma schema
        id: prisma_validate
        continue-on-error: true
        run: npm run db:validate

      - name: Production build
        id: production_build
        continue-on-error: true
        run: npm run build

      - name: Enforce static quality gates
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.lint.outputs.exit_code }}" != "0" ]; then
            echo "ESLint failed with exit code ${{ steps.lint.outputs.exit_code }}. See eslint-report artifact for exact findings."
            failed=1
          fi
          if [ "${{ steps.dependency_audit.outputs.exit_code }}" != "0" ]; then
            echo "Production dependency audit found high-or-critical vulnerabilities. See npm-audit-report artifact."
            failed=1
          fi
          if [ "${{ steps.typecheck.outcome }}" != "success" ]; then
            echo "Typecheck failed."
            failed=1
          fi
          if [ "${{ steps.unit_tests.outcome }}" != "success" ]; then
            echo "Unit tests failed."
            failed=1
          fi
          if [ "${{ steps.prisma_validate.outcome }}" != "success" ]; then
            echo "Prisma schema validation failed."
            failed=1
          fi
          if [ "${{ steps.production_build.outcome }}" != "success" ]; then
            echo "Production build failed."
            failed=1
          fi
          exit "$failed"

  database-bootstrap:
    name: PostgreSQL migrate, seed, integration assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lmere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lmere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/lmere_ci?sslmode=disable
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply versioned migrations to empty PostgreSQL
        run: npm run db:migrate

      - name: Seed deterministic CI fixtures
        run: npx prisma db execute --file prisma/ci-seed.sql --config=prisma.config.ts

      - name: Run PostgreSQL integration assertions
        run: npm run test:integration:db

      - name: Verify migration state
        run: npx prisma migrate status --config=prisma.config.ts
