name: Quality

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - master
  push:
    branches:
      - portfolio/revamp-2026

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Lint, typecheck, Prisma validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/lmere_ci?sslmode=disable
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Production build
        run: npm run build
