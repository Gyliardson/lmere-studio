name: Controller admin session finalize

on:
  push:
    branches:
      - work/2-admin-auth-isolation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/2-admin-auth-isolation
      - name: Apply bounded lifecycle follow-up
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/admin/page.tsx')
          s = p.read_text()
          old = '''  const handleLogout = async () => { try { await fetch("/api/admin/auth", { method: "DELETE" }); } finally { setAuthenticated(false); setTenantId(""); setTenantSlug(""); setTenantName(""); setPassword(""); setMobileDrawerOpen(false); } };'''
          new = '''  const handleLogout = async () => { try { const res = await fetch("/api/admin/auth", { method: "DELETE" }); if (!res.ok) { showToast("Não foi possível encerrar a sessão"); return; } setAuthenticated(false); setTenantId(""); setTenantSlug(""); setTenantName(""); setPassword(""); setMobileDrawerOpen(false); } catch { showToast("Erro de conexão ao encerrar a sessão"); } };'''
          assert old in s
          s = s.replace(old, new, 1)
          old_menu = '''<button onClick={() => setMobileDrawerOpen(!mobileDrawerOpen)} className="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-white"><MenuIcon className="w-6 h-6" /></button>'''
          new_menu = '''<button aria-label="Abrir menu do painel" onClick={() => setMobileDrawerOpen(!mobileDrawerOpen)} className="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-white"><MenuIcon className="w-6 h-6" /></button>'''
          assert old_menu in s
          s = s.replace(old_menu, new_menu, 1)
          p.write_text(s)
      - name: Commit lifecycle follow-up
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx
          git commit -m "fix: keep admin session state until server logout succeeds"
          git push origin HEAD:work/2-admin-auth-isolation
